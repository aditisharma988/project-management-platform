version: '3.8'

services:
  # The Single Master Database for your Entire SaaS Platform
  platform_db:
    image: postgres:16-alpine
    container_name: platform_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres@1408
      POSTGRES_DB: project-management-db
    ports:
      - "5432:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data

  # Caching Layer for high-frequency project and task lookups
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  # Zookeeper coordinator for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka Message Broker for asynchronous email alerts
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  platform_db_data: